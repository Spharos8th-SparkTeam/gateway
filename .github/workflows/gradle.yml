# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   types: [closed]
  #   branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  CI-CD:
    if: github.event_name == 'push'
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # with:
        #   ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: docker build & docker hub push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/gateway:${{ github.run_number }}" .
          docker push "${{ secrets.DOCKER_USERNAME }}/gateway:${{ github.run_number }}"

  Deploy-Dev:
    needs: CI-CD
    # if: github.event_name == 'push'
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Deploy to develop
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $image = "$env:DOCKER_USERNAME/gateway:$env:IMAGE_TAG"

          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $network = @(
            docker network ls --format "{{.Name}}" |
              Where-Object { $_ -eq "spharos" }
          )
          if ($network.Count -eq 0) {
            docker network create spharos
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          $container = @(
            docker ps -a --filter "name=gateway" --format "{{.Names}}" |
              Where-Object { $_ -eq "gateway" }
          )
          if ($container.Count -gt 0) {
            docker rm -f gateway
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          docker run -d --name gateway --restart unless-stopped --network spharos -p 8000:8000 -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/ -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Gateway Container
        shell: powershell
        run: |
          docker ps --filter "name=^/gateway$"

  Deploy-Prod:
    needs: CI-CD
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_EC2 }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -eu

            IMAGE="${{ secrets.DOCKER_USERNAME }}/gateway:${{ github.run_number }}"

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            sudo docker pull "$IMAGE"

            sudo docker network inspect spharos >/dev/null 2>&1 \
              || sudo docker network create spharos

            sudo docker rm -f gateway 2>/dev/null || true

            sudo docker run -d \
              --name gateway \
              --restart unless-stopped \
              --network spharos \
              -p 8000:8000 \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/ \
              "$IMAGE"

            test "$(sudo docker inspect -f '{{.State.Running}}' gateway)" = true
            sudo docker ps --filter "name=^/gateway$"
            sudo docker logs --tail 50 gateway